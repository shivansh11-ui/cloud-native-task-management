services:
  backend:
    build: ./backend
    environment:
      PORT: 4000
      JWT_SECRET: local-demo-secret
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend
