name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.sha }}
  KUBE_CONFIG_BASE64: ${{ secrets.KUBE_CONFIG_BASE64 }}
  CLOUD_HOST: ${{ secrets.CLOUD_HOST }}

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test backend
        run: |
          cd backend
          npm install
          npm test

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cloud-task-backend:${IMAGE_TAG} -t ${{ secrets.DOCKERHUB_USERNAME }}/cloud-task-backend:latest ./backend
          docker build --build-arg VITE_API_URL="" -t ${{ secrets.DOCKERHUB_USERNAME }}/cloud-task-frontend:${IMAGE_TAG} -t ${{ secrets.DOCKERHUB_USERNAME }}/cloud-task-frontend:latest ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-task-backend:${IMAGE_TAG}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-task-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-task-frontend:${IMAGE_TAG}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-task-frontend:latest

      - name: Deploy to Kubernetes
        if: ${{ env.KUBE_CONFIG_BASE64 != '' }}
        run: |
          mkdir -p ~/.kube
          echo "${KUBE_CONFIG_BASE64}" | base64 -d > ~/.kube/config
          cp kubernetes/deployment.yaml /tmp/deployment.yaml
          sed -i "s#__REGISTRY__#${{ secrets.DOCKERHUB_USERNAME }}#g" /tmp/deployment.yaml
          sed -i "s#__HOST__#${CLOUD_HOST}#g" /tmp/deployment.yaml
          kubectl apply -f /tmp/deployment.yaml
